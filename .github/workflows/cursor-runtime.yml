name: Cursor runtime portability

on:
  pull_request:
    paths:
      - '.github/workflows/cursor-runtime.yml'
      - 'skills/parallel-subagent-exec/**'
      - 'test/parallel-exec-cursor.test.mjs'
      - 'test/parallel-exec-state.test.mjs'
      - 'test/parallel-subagent-exec.test.mjs'
  push:
    paths:
      - '.github/workflows/cursor-runtime.yml'
      - 'skills/parallel-subagent-exec/**'
      - 'test/parallel-exec-cursor.test.mjs'
      - 'test/parallel-exec-state.test.mjs'
      - 'test/parallel-subagent-exec.test.mjs'

permissions:
  contents: read

jobs:
  cursor-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Verify bundled skills
        run: node scripts/verify-skills.mjs

      - name: Test Cursor runtime contracts
        run: node --test test/parallel-exec-cursor.test.mjs test/parallel-exec-state.test.mjs test/parallel-subagent-exec.test.mjs
