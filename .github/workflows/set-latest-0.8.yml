name: Set npm latest to 0.8.0

on:
  push:
    branches:
      - redesign/v0.8-docs-first
    paths:
      - .github/workflows/set-latest-0.8.yml

permissions:
  contents: read
  id-token: write

jobs:
  set-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Point latest at 0.8.0
        run: npm dist-tag add @ai-content-space/loopx@0.8.0 latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
