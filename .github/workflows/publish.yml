name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Attempt publishing the package version when it is absent from npm'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - package.json
      - plugins/loopx/.codex-plugin/plugin.json
      - docs/release-notes/**
      - .github/workflows/publish.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-version-change:
    if: github.ref_name != 'darwin'
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
      previous: ${{ steps.version.outputs.previous }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package version change
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION=""

          if git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
            PREVIOUS_VERSION=$(git show "${{ github.event.before }}:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")
          fi

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null || true)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "manual publish requested for $PACKAGE_NAME@$CURRENT_VERSION"
          elif [ -z "$PUBLISHED_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$CURRENT_VERSION is absent from npm; publishing it."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$CURRENT_VERSION is already present on npm."
          fi

  publish:
    needs: detect-version-change
    if: github.ref_name != 'darwin' && needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check whether this version is already published
        id: package_version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is new and will be published."
          fi

      - name: Publish package
        if: steps.package_version.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
